title: "EventPulse — College Event Feedback Analyzer"
pitch: "Instantly understand how students felt about your college event — powered by Strands Decider."
features:
  - "classify feedback as positive, negative, or neutral with calibrated confidence"
  - "flag low-confidence responses for human review instead of guessing"
  - "batch-analyze a list of responses and get a summary breakdown"
  - "load sample college event feedback for quick demos"
eager: false
intro: "EventPulse helps college event organizers understand student sentiment. For each feedback response, Strands Decider classifies the sentiment and returns a calibrated confidence score. Responses below the confidence threshold are flagged for human review instead of being forced into a label."
intro_normal: "EventPulse runs on Amazon Bedrock AgentCore Runtime. Strands Decider classifies the sentiment of each feedback response with calibrated confidence."
turns:
  - say: "Analyze this feedback from our Tech Fest: The hackathon was absolutely incredible! I learned so much and the mentors were super helpful."
    narrate: "A clear positive response. The decider classifies it as positive with high confidence."
  - say: "Now analyze this one: The food stalls ran out of food by noon, the queues were huge, and the staff was rude. Terrible experience."
    narrate: "A clear negative response. The decider catches the dissatisfaction and flags it."
  - say: "What about this: The event happened as scheduled. There were workshops in the morning and a competition in the afternoon."
    narrate: "A neutral, factual response with no emotional tone. The decider classifies it as neutral."
  - say: "Can you batch analyze these three responses: Amazing event, loved every moment! Very disappointing, nothing was on time. The seminar covered the basics."
    narrate: "A batch of three responses covering all three sentiments. The summary shows the full distribution."
outro: "One forward pass per classification, typed answers with calibrated confidence, and Amazon Bedrock for the conversation. EventPulse turns a pile of feedback into instant insight."
