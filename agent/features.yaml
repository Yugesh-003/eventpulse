# Amazon Bedrock AgentCore features for EventPulse.
# EventPulse uses Runtime only; Memory and Gateway are off.

memory:
  enabled: false
  name: agentmemory
  strategies: [SEMANTIC, USER_PREFERENCE]
  expiry_days: 30

gateway:
  enabled: false
  name: tools
  authorizer: AWS_IAM
  targets:
    - name: websearch
      type: connector
      connector: web-search
